<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>🏆 Sports Chatbot</h1>
            <p>Ask me about your favorite sports!</p>
        </div>

        <div id="chat-box" class="chat-box">
            <div class="message bot">
                <span>🤖</span>
                <p>Hello! Ask me about football, cricket, basketball, tennis or badminton.</p>
            </div>
        </div>

        <div class="input-area">
            <input id="message-input" type="text" placeholder="Type your sports question..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
